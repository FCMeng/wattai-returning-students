<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Four validation layers protect a tool boundary</title>
  <desc id="desc">A proposed tool call passes structure, domain, authorization, and confirmation checks before bounded execution.</desc>
  <rect width="960" height="350" fill="#ffffff"/>
  <text x="42" y="46" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">A valid tool call is not automatically an authorized action</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="45" y="122" width="145" height="82" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="117" y="153" font-size="18" font-weight="700" fill="#1e3a8a">1. Structure</text><text x="117" y="180" font-size="15">names and types</text>
    <rect x="230" y="122" width="145" height="82" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="302" y="153" font-size="18" font-weight="700" fill="#0c4a6e">2. Domain</text><text x="302" y="180" font-size="15">ranges and IDs</text>
    <rect x="415" y="122" width="145" height="82" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="487" y="153" font-size="18" font-weight="700" fill="#14532d">3. Authority</text><text x="487" y="180" font-size="15">user + resource</text>
    <rect x="600" y="122" width="145" height="82" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="672" y="153" font-size="18" font-weight="700" fill="#78350f">4. Confirm</text><text x="672" y="180" font-size="15">exact effect now</text>
    <rect x="785" y="122" width="135" height="82" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="852" y="153" font-size="18" font-weight="700" fill="#111827">Execute</text><text x="852" y="180" font-size="15">bounded function</text>
  </g>
  <g stroke="#111827" stroke-width="3" marker-end="url(#arrow)">
    <path d="M190 163 H220"/><path d="M375 163 H405"/><path d="M560 163 H590"/><path d="M745 163 H775"/>
  </g>
  <text x="480" y="265" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#991b1b">Any failed layer stops the call before the effect</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
</svg>
