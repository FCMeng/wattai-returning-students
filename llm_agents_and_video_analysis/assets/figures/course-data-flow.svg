<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Course data flow</title>
  <desc id="desc">A Jupyter notebook sends an authenticated HTTPS request through the Clemson network to the RCD LLM service, which returns a response. The API key remains in notebook memory.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#172033}.label{font-weight:600}.small{font-size:13px;fill:#475569}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.service{fill:#ecfdf5;stroke:#059669;stroke-width:2}.boundary{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 7}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}
    @media(prefers-color-scheme:dark){text{fill:#e5e7eb}.small{fill:#cbd5e1}.box{fill:#172554}.service{fill:#064e3b}.boundary,.arrow{stroke:#cbd5e1}}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect class="box" x="40" y="72" width="210" height="90" rx="12"/><text class="label" x="145" y="108" text-anchor="middle">Jupyter notebook</text><text class="small" x="145" y="136" text-anchor="middle">prompt + model + settings</text>
  <rect class="boundary" x="310" y="30" width="610" height="185" rx="18"/><text class="small" x="330" y="56">Clemson network / CUVPN boundary</text>
  <rect class="service" x="390" y="72" width="210" height="90" rx="12"/><text class="label" x="495" y="108" text-anchor="middle">RCD API</text><text class="small" x="495" y="136" text-anchor="middle">authentication + routing</text>
  <rect class="service" x="680" y="72" width="190" height="90" rx="12"/><text class="label" x="775" y="108" text-anchor="middle">Local model</text><text class="small" x="775" y="136" text-anchor="middle">inference</text>
  <path class="arrow" d="M250 102 H390"/><text class="small" x="320" y="90" text-anchor="middle">HTTPS request</text>
  <path class="arrow" d="M600 117 H680"/>
  <path class="arrow" d="M680 148 H600"/><path class="arrow" d="M390 148 H250"/><text class="small" x="320" y="180" text-anchor="middle">response</text>
  <text class="small" x="145" y="205" text-anchor="middle">API key stays in process memory; never save it in the notebook.</text>
</svg>
