<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Chat roles become one serialized token sequence</title>
  <desc id="desc">System, user, and assistant message cards enter a chat template and become an ordered sequence of role markers and content tokens.</desc>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="40" y="44" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">Keep roles structured until the chat template serializes them</text>
  <g font-family="sans-serif" font-size="18">
    <rect x="55" y="78" width="245" height="58" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="75" y="105" font-weight="700" fill="#1e3a8a">system</text><text x="75" y="126" fill="#111827">rules and context</text>
    <rect x="55" y="151" width="245" height="58" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="75" y="178" font-weight="700" fill="#14532d">user</text><text x="75" y="199" fill="#111827">current request</text>
    <rect x="55" y="224" width="245" height="58" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="75" y="251" font-weight="700" fill="#78350f">assistant</text><text x="75" y="272" fill="#111827">earlier response</text>
    <path d="M320 180 H410" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="420" y="125" width="180" height="110" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="510" y="165" text-anchor="middle" font-weight="700" fill="#4c1d95">chat template</text>
    <text x="510" y="194" text-anchor="middle" fill="#111827">role markers</text>
    <text x="510" y="217" text-anchor="middle" fill="#111827">+ content</text>
    <path d="M610 180 H700" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="710" y="112" width="205" height="136" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="812" y="148" text-anchor="middle" font-weight="700" fill="#111827">token sequence</text>
    <text x="812" y="180" text-anchor="middle" font-family="monospace" font-size="15" fill="#111827">&lt;system&gt; ...</text>
    <text x="812" y="205" text-anchor="middle" font-family="monospace" font-size="15" fill="#111827">&lt;user&gt; ...</text>
    <text x="812" y="230" text-anchor="middle" font-family="monospace" font-size="15" fill="#111827">&lt;assistant&gt;</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
</svg>
