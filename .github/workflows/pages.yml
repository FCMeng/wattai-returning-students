name: Deploy student course website

on:
  push:
    branches: ["2026-Fall"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the student distribution
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare individual downloads
        run: |
          mkdir -p site/llm-agents-and-video-analysis/downloads/notebooks
          mkdir -p site/llm-agents-and-video-analysis/downloads/homework
          cp llm_agents_and_video_analysis/notebooks/*.ipynb site/llm-agents-and-video-analysis/downloads/notebooks/
          cp llm_agents_and_video_analysis/homework/*.md site/llm-agents-and-video-analysis/downloads/homework/
      - name: Upload the reviewed static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
